<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SignalR Chat</title>

    <link rel="stylesheet" href="style.css">

    <!-- SignalR Client -->
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
</head>

<body>

    <div class="container">

        <h1>SignalR Chat</h1>

        <div id="status" class="status disconnected">
            Disconnected
        </div>

        <section>

            <h2>User</h2>

            <input id="username" type="text" placeholder="Your name">

        </section>


        <section>

            <h2>Message</h2>

            <input id="message" type="text" placeholder="Write a message...">

        </section>


        <section>

            <h2>Broadcast</h2>

            <button id="sendAll">
                Send To Everyone
            </button>

        </section>


        <section>

            <h2>Group</h2>

            <input id="groupName" type="text" placeholder="Group name">

            <div class="buttons">

                <button id="joinGroup">
                    Join Group
                </button>

                <button id="sendGroup">
                    Send To Group
                </button>

            </div>

        </section>


        <section>

            <h2>Messages</h2>

            <div id="messages"></div>

        </section>

    </div>


    <script src="script.js"></script>

</body>

</html>
